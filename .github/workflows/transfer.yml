name: Python Media Archive & HLS Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: Run Media Processing Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python transfer.py
