      - name: Download, Transcode to HLS, and Upload Assets
        run: |
          # Ensure urls.txt exists
          if [ ! -f urls.txt ]; then
            echo "Error: urls.txt file not found!"
            exit 1
          fi

          # Loop through each line in urls.txt (Format: URL | Output_Filename.mp4)
          while IFS='|' read -r raw_url raw_filename || [ -n "$raw_url" ]; do
            # Trim whitespace from variables
            url=$(echo "$raw_url" | xargs)
            filename=$(echo "$raw_filename" | xargs)

            # Skip empty lines or comments
            [ -z "$url" ] || [[ "$url" =~ ^# ]] && continue

            # Fallback if filename is missing after pipe
            if [ -z "$filename" ]; then
              filename="media_asset_$(date +%s).mp4"
            fi

            echo "=================================================="
            echo "Processing File: $filename"
            echo "URL: $url"
            echo "=================================================="

            # 1. Download raw video file
            curl -L -s "$url" -o "input_temp_file"

            # Check if download succeeded
            if [ ! -f "input_temp_file" ]; then
              echo "Failed to download $filename. Skipping..."
              continue
            fi

            # 2. Create target directory for HLS output
            folder_name="${filename%.mp4}"
            # Extra check to guarantee folder_name is never empty
            if [ -z "$folder_name" ]; then
              folder_name="output_stream"
            fi

            mkdir -p "$folder_name"

            # 3. Probe codecs for smart transcoding
            V_CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 input_temp_file || echo "unknown")
            A_CODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 input_temp_file || echo "unknown")

            echo "Detected Video Codec: $V_CODEC"
            echo "Detected Audio Codec: $A_CODEC"

            # Determine Video Flag (Copy vs Transcode)
            if [ "$V_CODEC" = "h264" ]; then
                V_FLAG="-c:v copy"
            else
                echo "Non-standard video codec detected. Re-encoding to H.264..."
                V_FLAG="-c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p"
            fi

            # Determine Audio Flag (Copy vs Transcode)
            if [ "$A_CODEC" = "aac" ]; then
                A_FLAG="-c:a copy"
            else
                echo "Non-standard audio codec detected. Re-encoding to AAC..."
                A_FLAG="-c:a aac -b:a 128k"
            fi

            # 4. Generate universal web-playable HLS Chunks
            ffmpeg -i "input_temp_file" \
              $V_FLAG $A_FLAG \
              -start_number 0 \
              -hls_time 4 \
              -hls_list_size 0 \
              -f hls "$folder_name/index.m3u8"

            # Renaming chunks to include movie title prefix so files don't collide
            cd "$folder_name"
            for file in index*.ts; do
              if [ -f "$file" ]; then
                mv "$file" "${folder_name}_${file}"
              fi
            done
            # Update index.m3u8 references to match renamed chunks
            sed -i "s/index/${folder_name}_index/g" index.m3u8
            cd ..

            # 5. Upload chunks and playlist to GitHub Release (v1.0.0)
            echo "Uploading assets to GitHub Release..."
            gh release upload v1.0.0 $folder_name/* --clobber

            # 6. Cleanup local runner storage to avoid disk full errors
            rm -rf input_temp_file "$folder_name"
            echo "Finished processing $filename cleanly."

          done < urls.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
