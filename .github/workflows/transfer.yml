name: Bulk Transfer Archive Videos to Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      urls_list:
        description: 'Paste your URL | Filename lines here'
        required: true
        type: string

# Grant explicit permissions to create releases and upload files
permissions:
  contents: write

jobs:
  bulk-transfer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Clearing unwanted tool packages to free disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space freed successfully."

      - name: Ensure Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating it..."
            gh release create "$TAG" --title "Release $TAG" --notes "Automated video asset release."
          fi

      - name: Download, Upload, and Clean Up Loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URLS_DATA: ${{ inputs.urls_list }}
        run: |
          TAG="${{ inputs.release_tag }}"
          
          # Read inputs line by line
          echo "$URLS_DATA" | while IFS= read -r line || [ -n "$line" ]; do
            # Skip empty lines
            [ -z "$line" ] && continue
            
            # Split line by pipe (|)
            URL=$(echo "$line" | awk -F'|' '{print $1}' | xargs)
            FILENAME=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
            
            if [ -n "$URL" ] && [ -n "$FILENAME" ]; then
              echo "--------------------------------------------------"
              echo "Processing: $FILENAME"
              echo "Downloading from: $URL"
              
              # Download file with cURL
              if curl -L -s --fail -o "$FILENAME" "$URL"; then
                echo "Uploading $FILENAME to Release $TAG..."
                if gh release upload "$TAG" "$FILENAME" --clobber; then
                  echo "Successfully uploaded $FILENAME"
                else
                  echo "Failed to upload $FILENAME to Release"
                fi
                
                # Clean up local file immediately
                rm -f "$FILENAME"
              else
                echo "Failed to download from $URL"
              fi
            fi
          done
