name: Process and Upload Media Assets

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download, Transcode to HLS, and Create Dedicated Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS='|' read -r url output_name; do
            url=$(echo "$url" | xargs)
            output_name=$(echo "$output_name" | xargs)
            
            if [ -z "$url" ]; then
              continue
            fi

            echo "================================================="
            echo "Processing File: $output_name"
            echo "URL: $url"
            echo "================================================="

            curl -L -o input_temp.mp4 "$url"

            if [ ! -f input_temp.mp4 ] || [ ! -s input_temp.mp4 ]; then
              echo "Error: Download failed or empty file."
              exit 1
            fi

            base_name="${output_name%.*}"
            mkdir -p "$base_name"

            ffmpeg -i input_temp.mp4 -codec:v libx264 -codec:a aac -hls_time 10 -hls_playlist_type vod -hls_segment_filename "$base_name/index_%03d.ts" "$base_name/index.m3u8"

            TAG_NAME="${base_name}_release"
            echo "Creating GitHub Release Tag: $TAG_NAME..."
            
            gh release create "$TAG_NAME" --title "Release: $base_name" --notes "Automated HLS transcode release for $base_name" || true

            echo "Uploading playlist file..."
            gh release upload "$TAG_NAME" "$base_name/index.m3u8" --clobber
            sleep 1

            echo "Uploading video segments in safe batches..."
            for file in "$base_name"/*.ts; do
              gh release upload "$TAG_NAME" "$file" --clobber
              sleep 2
            done

            rm -f input_temp.mp4

          done < urls.txt
