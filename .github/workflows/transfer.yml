import os
import sys
import subprocess
import requests
import time

def process_line(line):
    line = line.strip()
    if not line or line.startswith("#"):
        return None, None
    
    if line.startswith("(") and line.endswith(")"):
        line = line[1:-1].strip()
    
    parts = line.split(",")
    if len(parts) >= 2:
        url = parts[0].strip().strip('"').strip("'")
        slug = parts[1].strip().strip('"').strip("'")
        return url, slug
    return None, None

def get_archive_files_from_url(url):
    """
    Checks if the URL is an Internet Archive details or download link.
    If it's an archive item, queries the metadata API to find all video files 
    associated with that item. Returns a list of (file_url, file_name) tuples.
    """
    if "archive.org" not in url:
        return [(url, None)]

    parts = url.split('/')
    try:
        if "download" in parts:
            idx = parts.index("download")
            identifier = parts[idx + 1]
        elif "details" in parts:
            idx = parts.index("details")
            identifier = parts[idx + 1]
        else:
            return [(url, None)]
    except (ValueError, IndexError):
        return [(url, None)]

    metadata_url = f"https://archive.org/metadata/{identifier}"
    print(f"Querying Internet Archive metadata for identifier: {identifier}...")
    
    try:
        response = requests.get(metadata_url, timeout=15)
        response.raise_for_status()
        data = response.json()
        
        files = data.get("files", [])
        video_files = []
        
        for f in files:
            name = f.get("name", "")
            if name.lower().endswith(('.mp4', '.mkv', '.avi', '.mov', '.webm')):
                file_url = f"https://archive.org/download/{identifier}/{name}"
                video_files.append((file_url, name))
                
        if video_files:
            print(f"Found {len(video_files)} video file(s) under archive item '{identifier}'.")
            return video_files
            
    except Exception as e:
        print(f"Warning: Could not fetch metadata API for {identifier}: {e}")

    return [(url, None)]

def download_file(url, output_filename):
    print(f"Downloading {url}...")
    response = requests.get(url, stream=True)
    response.raise_for_status()
    with open(output_filename, 'wb') as f:
        for chunk in response.iter_content(chunk_size=8192):
            if chunk:
                f.write(chunk)
    print(f"Saved to {output_filename}")

def transcode_to_hls(input_file, output_dir):
    os.makedirs(output_dir, exist_ok=True)
    playlist_path = os.path.join(output_dir, "playlist.m3u8")
    
    print(f"Transcoding {input_file} to HLS...")
    cmd = [
        "ffmpeg", "-i", input_file,
        "-codec:v", "libx264", "-codec:a", "aac",
        "-hls_time", "10", "-hls_list_size", "0",
        "-f", "hls", playlist_path
    ]
    subprocess.run(cmd, check=True)
    print(f"Transcoding complete: {playlist_path}")

def upload_to_github_release(slug, output_dir):
    tag_name = f"media-{slug}"
    print(f"Checking/Creating GitHub Release for tag: {tag_name}")
    
    create_release_cmd = ["gh", "release", "create", tag_name, "--title", f"Release {slug}", "--notes", f"Automated HLS transcode for {slug}"]
    result = subprocess.run(create_release_cmd, capture_output=True, text=True)
    
    if result.returncode != 0 and "already exists" not in result.stderr:
        print(f"Warning/Error creating release: {result.stderr}")
    
    archive_name = f"{slug}.zip"
    print(f"Archiving {output_dir} to {archive_name}...")
    subprocess.run(["zip", "-r", archive_name, output_dir], check=True)
    
    print(f"Uploading {archive_name} to release {tag_name}...")
    upload_cmd = ["gh", "release", "upload", tag_name, archive_name, "--clobber"]
    subprocess.run(upload_cmd, check=True)
    
    if os.path.exists(archive_name):
        os.remove(archive_name)

def main():
    # Automatically target urls.txt by default (or accept a command-line argument if provided)
    urls_file = sys.argv[1] if len(sys.argv) > 1 else "urls.txt"
    
    if not os.path.exists(urls_file):
        print(f"Error: File {urls_file} not found.")
        sys.exit(1)

    print(f"Reading links from: {urls_file}")
    with open(urls_file, 'r') as f:
        lines = f.readlines()

    for line in lines:
        url, base_slug = process_line(line)
        if not url or not base_slug:
            continue

        target_files = get_archive_files_from_url(url)

        for file_url, archive_filename in target_files:
            if archive_filename and len(target_files) > 1:
                clean_name = os.path.splitext(os.path.basename(archive_filename))[0]
                slug = f"{base_slug}_{clean_name}"
            else:
                slug = base_slug

            output_dir = os.path.join("output", slug)
            playlist_path = os.path.join(output_dir, "playlist.m3u8")

            if os.path.exists(playlist_path):
                print(f"Skipping '{slug}': Already processed locally (found {playlist_path}).")
                continue

            print(f"\n--- Processing: {slug} ---")
            temp_input = f"temp_{slug}.mp4"

            try:
                download_file(file_url, temp_input)
                transcode_to_hls(temp_input, output_dir)
                upload_to_github_release(slug, output_dir)
            except Exception as e:
                print(f"Error processing {slug}: {e}")
            finally:
                if os.path.exists(temp_input):
                    os.remove(temp_input)

            time.sleep(1)

if __name__ == "__main__":
    main()
